---
# Target-side SQLite transaction protects check+mutation from a TOCTOU race.
# This does NOT imply Ansible or arbitrary cloud resources offer this semantics.
- name: Run version-conditional synthetic action
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    edlab_token: "{{ lookup('ansible.builtin.env', 'EDLAB_TOKEN') }}"
  tasks:
    - name: Require captured evidence and credential
      ansible.builtin.assert:
        that:
          - edlab_approved_target is defined
          - edlab_approved_version is defined
          - edlab_approved_status is defined
          - edlab_event_id is defined
          - edlab_token | length >= 24
    - name: Attempt atomic target-side compare and mutate
      ansible.builtin.uri:
        url: "{{ lab_api_url | regex_replace('/+$', '') }}/v1/actions/conditional"
        method: POST
        headers:
          Authorization: "Bearer {{ edlab_token }}"
        body_format: json
        body:
          target_id: "{{ edlab_approved_target }}"
          event_id: "{{ edlab_event_id }}"
          desired_status: healthy
          expected_version: "{{ edlab_approved_version | int }}"
          expected_status: "{{ edlab_approved_status }}"
        status_code: [200, 409]
        timeout: 12
      register: action_result
      no_log: true
    - name: Show sanitized conditional outcome
      ansible.builtin.debug:
        msg:
          http_status: "{{ action_result.status }}"
          disposition: "{{ action_result.json.disposition }}"
          actual_version: "{{ action_result.json.actual_version | default(action_result.json.version | default('unknown')) }}"
          action_count: "{{ action_result.json.action_count | default('unknown') }}"
    - name: Mark a rejected stale action as an expected defensive failure
      ansible.builtin.assert:
        that:
          - action_result.status == 200
        fail_msg: "EXPECTED STALE EVIDENCE BLOCK - target refused mutation with HTTP 409."
        success_msg: "Conditional target-side mutation succeeded."
    - name: Propagate expected postcondition for verification
      ansible.builtin.set_stats:
        data:
          edlab_expected_version_after: "{{ action_result.json.version | int }}"
          edlab_expected_action_count: "{{ action_result.json.action_count | int }}"
          edlab_expected_status_after: healthy
        per_host: false
        aggregate: false
